# 本文件只放**非敏感**配置。密钥（API Key / 登录密码 / 各种 token）只写在同目录的
# secret.yaml（首次运行会自动从模板创建，权限 0600、不进版本库）。
# 环境变量 GOOD_REVIEW_LLM_API_KEY / GOOD_REVIEW_WEB_PASSWORD / GOOD_REVIEW_IM_TOKEN
# 优先于 secret.yaml。

# ===== 机器人配置 =====
bot:
  # 允许响应的群白名单。QQ 官方机器人填 group_openid（长字符串）。
  # 支持两种写法：逗号分隔字符串，或 YAML 列表（逐项也可写注释）。
  # 填 "*" 表示所有群都响应（注意：任意群都能触发大模型调用，成本不可控）。
  allow_groups: "123456,789012"
  # 列表写法等价：allow_groups:
  #   - "123456"
  #   - "789012"
  # 允许自动开通的工作空间 ID（完整 ID = 平台名_账号类型_接收账号），填 "*" 表示全部。
  # 支持两种写法：逗号分隔字符串，或 YAML 列表（逐项也可写注释）。
  # 空列表 = 不自动开通（安全默认）；已记录在 state.db 里的工作空间不受名单影响，
  # 重启会直接恢复。QQ 官方机器人：平台 qq，类型 official_bot，账号填 AppID，
  # 所以是 qq_official_bot_<AppID>。
  allow_workspace_accounts: ["qq_official_bot_1906xxxx", "qq_official_bot_1904xxxx"]
  # 字符串写法等价：allow_workspace_accounts: "qq_official_bot_1906xxxx,qq_official_bot_1904xxxx"
  # 主动插话：没被 @ 时也先让大模型判断"要不要接话"。默认关闭。
  # 全局一份，所有账号共用。冷却/上限只约束主动路径，不影响 @ 回复。
  # 裁判看的窗口与生成一致（runtime.llm_send_count 条），不再单独配置。
  proactive_enabled: true
  # 显式写 0 都有效；想用默认值请删掉该行（缺省才是默认，0 不再被覆盖）。
  proactive_cooldown_sec: 90       # 0 = 主动发言后不冷却
  proactive_max_streak: 5          # 0 = 不主动发言
  # 两次判定的最小间隔（秒）：从"上次裁判开始"计时，含该轮裁判+生成的大模型耗时。
  # 单轮耗时 ≥ 间隔时下一轮立刻放行；间隔内到达的新消息直接丢弃，不排队延后。
  proactive_judge_interval_sec: 20 # 0 = 不设最小间隔
  proactive_judge_timeout_sec: 20  # 0 = 沿用 runtime.llm_timeout_sec
  proactive_judge_images: 1        # 0 = 图片消息不判定；需 llm.image_max>0 才有效

# ===== IM 接入（OneBot 12） =====
# 入站事件由实现端（AstrBot 插件 / Satori sidecar）推送到 runtime.im_listen_addr，
# 路径是 /im/event/{account}。出站动作按账号走下面的 api_base。
im:
  # 所有账号默认的出站地址（实现端 OneBot 12 动作服务）。
  # 常见部署一个 AstrBot 插件服务所有账号，只配这一行即可；账号 ID 从入站事件自动得到。
  api_base: "http://127.0.0.1:6199"
  # 实现端是否会把机器人自己发出的消息再回传成入站事件（NapCat 这类会，AstrBot 桥不会）。
  # true 时机器人回复靠回传事件入库，本地不再重复记录。默认 false。
  echo_self_messages: false
  # 可选：多套实现端/多端口时按账号覆盖；不写 api_base 表示沿用上面的默认地址。
  # accounts:
  #   - id: "qq_official_bot_1904xxxx"
  #     api_base: "http://127.0.0.1:6200"

# ===== 运行时参数 =====
runtime:
  # 每次尽量发送给 LLM 的消息条数，如果能用利用缓存命中则会多发，但不会超出重新发送设置数量的成本
  llm_send_count: 20
  # 调用大模型超时（秒）
  llm_timeout_sec: 120
  # 单条消息最大字符数（超出截断）
  max_msg_rune: 500
  # 分句回复：>0 时把排版后的句子拆成最多 5 条消息逐条发送，每条间隔这么多毫秒（更像真人一条条发）；
  # 0 = 不拆分，所有句子合成一条消息。注意 QQ 官方对同一条触发消息的被动回复最多 5 次，
  # 所以超过 5 句时会自动把余下句子合并进第 5 条。默认 800。
  reply_send_interval_ms: 800
  # 环形缓冲条数上限（手动配，建议 ≈31×llm_send_count；几百 KB/群不会爆内存）
  max_cache_msg: 3100
  # AstrBot 桥接插件推送事件的监听地址（与插件的 event_url 主机端口对应，
  # 路径是 /im/event/{account}）
  im_listen_addr: "127.0.0.1:18090"
  # Web 管理面板端口（<=0 禁用）
  web_port: 7090
  # Web 管理面板登录账号（密码在 secret.yaml 的 web_password，必填，无免密模式）
  web_username: "admin"
  # JWT 签名密钥在 secret.yaml 的 jwt_secret。留空会回退用 web_password 签名并打告警。
  # 建议单独设一个随机长字符串：一是改密码不会让所有已登录会话掉线，
  # 二是签名密钥与登录凭据分开，泄露面更小。
  # 生成方式：openssl rand -hex 32
  # 允许跨域访问管理面板的来源（逗号分隔）。默认空 = 仅同源，不下发任何 CORS 头。
  # 前端是内嵌同源 H5、开发时 Vite 走 proxy，正常都不需要配。
  # 只有把面板嵌到别的站点时才填，例如：http://localhost:5173,https://panel.example.com
  # 填 "*" 表示放行任意来源（不推荐：等于任何网站都能带凭据读你的面板接口）
  cors_origins: ""
  # 是否开放 /api/debug/pprof/（CPU / heap / goroutine profile）。
  # 挂在已鉴权的 /api 组下，需先登录取 token。排查卡顿与 goroutine 泄漏时临时打开。
  enable_pprof: false
  # 优雅关闭前「先标 not-ready、等一会儿、再停监听」的秒数。
  # 默认 0：立即停监听，退出最快，行为与没这个配置时一致。
  # 只有把面板放在 LB / K8s / nginx 后面才需要设（例如 5）：
  # 这类调用方每几秒探一次 /readyz，必须先看到 503 才有时间把流量切走；
  # 否则它们要等连接被拒才反应过来，那期间的新请求会直接失败。
  # 代价是每次退出都要多等这么久，所以要小于上层给的关闭预算（app 里是 10 秒）。
  shutdown_delay_sec: 0
  # 内嵌 MCP 服务端鉴权 Bearer token 在 secret.yaml 的 mcp_builtin_token（agent「看图」等内置工具用）。
  # 留空 = 服务只绑定 127.0.0.1 且不校验；填了值则要求请求带同一 token（机器人自己会带）。
  # 【未来外开放口】目前内嵌服务仅 127.0.0.1 回环自用。若将来要对外开放：需把监听改成可配
  # 地址/固定端口、加 view_image 下载域名白名单（防 SSRF/被当跳板）、建议反代做 TLS。token 机制已就绪。
  # Prometheus 指标端点 /metrics 的监听地址。默认只绑本机，独立于上面的 web_port：
  # 面板要过 JWT 而 Prometheus 抓取带不了，而且面板关掉（web_port<=0）时依然值得被观测。
  # 改地址需要重启才生效。填 off（或 none/disabled）可完全关闭。
  metrics_addr: "127.0.0.1:9100"
  # OpenTelemetry 链路追踪上报地址（OTLP/HTTP，例如 http://localhost:4318）。
  # 留空 = 关闭（默认）。关闭时 trace 相关埋点全部是 no-op，没有开销。
  # 想看图时起一个后端再指过来，例如：docker run --rm -p 16686:16686 -p 4318:4318 jaegertracing/all-in-one
  otlp_endpoint: ""

# ===== 大模型配置 =====
llm:
  # 固定填 openai（兼容所有OpenAI格式模型）
  provider: "openai"
  # 大模型接口地址
  api_base: "https://api.deepseek.com"
  # 模型名
  model_name: "deepseek-v4-flash"
  # 缓存命中单价（相对值，用于自动计算扩展阈值；deepseek-v4-flash 8/17 调价后命中/未命中 ≈ 1/30）
  cache_hit_cost: 0.033
  # 缓存未命中单价（相对值）
  cache_miss_cost: 1.0
  # 单次发送大模型的 token 上下文context上限，大模型官方写多少上限，就可以写多少（模糊计算，非绝对值）
  # 系统发送给大模型消息时，会加入上次发送的消息来使用缓存命中，系统保证缓存命中的成本不会超过未命中的成本
  # 但是如果加入上次发送的消息，可能会超过大模型长度限制，所以需要设置本值
  # 如果扩展后单次发给大模型的聊天记录估算超过此值 → 拒绝加入上次发送的消息，改按 llm_send_count 重置发送
  # 换算：纯中文约 1 token/字，故 50000 ≈ 约 5 万汉字 ≈ 约 2500 条消息
  # 模型上下文更大可调高；想更省内存/降单次请求延迟可调低
  max_context_tokens: 50000
  # agent「看图」：单次回复「实际下载并回传给模型看」的图片张数上限（0=不启用看图，纯文本；启用建议 1~3）。
  # 注意：候选列表会列出窗口内全部图片 url（只是文字，便宜）；真正花 token 的是模型实际查看，由本值硬限。
  # 启用后机器人会在本机内嵌一个 MCP 服务，提供 view_image/看图 工具，模型按需调用、机器人下载后回传
  image_max: 3
  # 最终回复的句数上限：模型正常出稿后，再把回复发回去用 JSON schema 拆成最多这么多句短句，
  # 让回复更像真人、不再是一大段。0 = 关闭这次排版（直接发原文）。默认 5。
  # 模型多给的句子会合并到最后一句，不会丢内容。
  # 注意：开启后每条回复会多一次大模型调用（排版请求很短，成本很低）。
  reply_max_sentences: 5
  # 原稿不足这么多字就不排版（直接发原文），省一次模型调用。默认 60；显式 0 = 不设下限。
  reply_rewrite_min_runes: 60
  # 入库图片描述：图片进群时算内容哈希（sha256+大小），未命中全局图库就同步调一次低清描述并入库。
  # 之后候选列表会带上「内容/信息量」，模型据此决定是否再看原图；view_image 仍是纯工具。
  # 描述图的长边（像素）。越小越省视觉 token；显式 0 = 关闭入库描述（回到纯工具看图）。
  image_note_max_side: 640
  # 描述图的总像素上限（防止超长截图把 token 拉高）；显式 0 = 不限制。
  image_note_max_pixels: 400000
  # 单张图描述超时（秒）；显式 0 = 用 runtime.llm_timeout_sec。
  image_note_timeout_sec: 15
  # 描述失败后的重试次数；显式 0 = 不重试（失败后按"无描述"处理）。
  image_note_retries: 2
  # 单条消息内最多并发描述几张图；显式 0 = 按 1 处理。整条消息另有 30 秒总预算。
  image_note_concurrency: 3
  # view_image 允许读取的本地图片目录。QQ 官方机器人收到的图片在 AstrBot 里是本地临时文件
  # （如 ~/.astrbot/data/temp/media_image_*.png），不是 http URL。
  # 不写默认 ["~/.astrbot/data/temp"]；自定义 AstrBot 数据目录时改这里。
  # 只允许读这些目录下的图片，避免模型被诱导读取配置/密钥等任意本地文件。
  image_local_dirs:
    - "~/.astrbot/data/temp"
  # 锐评风格：1.0=发散 0.5=集中
  temperature: 1.2
  # 核采样参数：越小输出越集中
  top_p: 0.95
  # 出站全局限速（每秒允许的调用数）。0 = 不限速（默认）。
  # 只在明确知道上游有配额上限时开：超过限速的调用会被**直接拒绝**（群里会看到
  # "大师今天罢工了"），而不是排队等待——等待只会把协程池的 worker 占住。
  rate_limit_per_sec: 0
  # 令牌桶容量（允许的瞬时突发）。不写或 0 = 按上面的速率向上取整、至少 1。
  rate_limit_burst: 0
  # 熔断：大模型连续失败多少次后打开，打开期间调用被立刻拒绝（不会干等 llm_timeout_sec），
  # 冷却一段时间后进入半开、放一个请求去试探。不写默认 5；填 -1 关闭熔断。
  # 默认开着，因为只有"已经连续失败 5 次"时它才动作，而那时每次放开调用都要等满 120 秒。
  breaker_failures: 5
  # 熔断后的冷却秒数（不写默认 30）
  breaker_cooldown_sec: 30

# ===== 三段流水线（B1 → Stage1 → B2 → Stage2 → B3 → Stage3） =====
# 旋钮规则：不写 = 用默认值；显式写 0 按下面的注释生效；负数启动失败。
# 其中大部分参数可以在运行时通过 state.db 的 settings 表覆盖（键为 "pipeline"，
# 值为同样字段名的 JSON 对象），库里的覆盖优先于本文件。批量/并发/容量不允许运行时改 0。
pipeline:
  # Stage 1（同步/补全）：一次取几条、凑批最多等多久、同时几个会话在跑、失败重试次数
  sync_batch: 20
  sync_linger_ms: 20              # 0 = 不等，来一条处理一条
  sync_concurrency: 4
  sync_retries: 3                 # 0 = 不重试，直接进问题件
  # Stage 2（资产打标签）：一批消息一起打标签，便于统一限流
  asset_batch: 4
  asset_linger_ms: 20             # 0 = 不等
  asset_concurrency: 2
  asset_retries: 3                # 0 = 不重试
  # Stage 3（Agent）：当前逐条执行，批量只用于出队效率
  agent_batch: 1
  agent_linger_ms: 0              # 0 = 不等
  agent_concurrency: 2
  agent_retries: 3                # 0 = 不重试
  # 单群/单私聊最多积压多少条；整个进程最多积压多少条（0 会让流水线停摆，非法）
  per_chat_capacity: 500
  global_capacity: 5000
  # 一个会话多久没消息就让它的处理协程休眠（秒）；0 = 永不回收（不推荐）
  # 休眠只结束按需创建的协程；下次来消息会重新拉起，不丢状态（状态都在库里）。
  idle_ttl_sec: 600
  # 优雅关闭时最多等多久把存量处理完（秒）；0 = 不等待，直接落库
  drain_timeout_sec: 10

# ===== 资产（图片描述与后台补标签） =====
# 同样支持运行时用 settings 表的 "assets" 键覆盖；值为同名字段 JSON。
assets:
  # Stage 2 超时/容量满时把欠条写入 asset_tag_jobs，这个开关控制后台是否去补
  backfill_enabled: true
  backfill_interval_sec: 60       # 0 = 关闭扫描（等同开关关）
  backfill_batch: 20              # 一次补多少张（0 非法）
  backfill_max_attempts: 3        # 一张欠条最多补几次；0 = 不重试
  job_retention_days: 30          # 已完成/已消失台账保留天数；0 = 永久保留
  # 一条消息内所有图片描述共用的总预算（秒）；0 = 不限制
  message_budget_sec: 30
  # 同一时刻最多描述几张图（跨消息）；0 非法
  tag_concurrency: 3
  # 延后打标签时原图副本的本地目录（相对程序工作目录）；URL 过期后靠它重试
  defer_cache_dir: "asset-cache"
  defer_cache_max_bytes: 268435456 # 256MB；0 = 不保存原图副本
  defer_cache_ttl_days: 7          # 副本保留天数；0 = 不过期
  # 写进图库记录的提示词版本；换描述提示词时改它，便于按版本重刷
  prompt_version: "1"

# ===== MCP 工具服务配置 =====
# 开启后：启动时自动连接下面列出的每个服务，自动拉取其工具清单（tools/list），
# 并把「inject 为 true」的服务的工具作为原生 function calling 注入每一次对话。
# 模型觉得需要时自己发起调用 → 后端执行 MCP tools/call → 结果回填给模型 → 循环，
# 直到模型给出最终文本答案，才发到群里。
mcp:
  # 总开关：false 时下面所有服务都不连接，对话也不带工具
  enabled: true
  # 单个工具调用超时（秒）
  tool_timeout_sec: 30
  # 单次对话最大工具调用轮数。达到上限后不再下发工具，强制模型直接作答
  # 注意：每一轮都会重发一次完整上下文（含聊天记录），轮数越多越烧钱；
  # 好在第 2 轮起前缀与第 1 轮完全一致，走缓存命中价，边际成本很低
  max_tool_rounds: 5
  # 单个工具返回结果的最大字符数，超出截断（防止一次返回几十 KB 撑爆上下文）
  max_tool_result_rune: 2000
  # 连接失败后的自动重连间隔（秒）；不写默认 60，写 -1 表示禁用自动重连
  retry_interval_sec: 60
  # 单个服务的工具连续失败多少次后熔断（按服务分别计数）；不写默认 5，写 -1 关闭熔断。
  # 工具清单里留着一个"连得上但一调就报错"的服务时，模型会反复调它、每次干等 30 秒；
  # 熔断打开后立刻失败，模型能更快改口作答。
  breaker_failures: 5
  # 熔断后的冷却秒数（不写默认 60）
  breaker_cooldown_sec: 60
  # 服务列表，每一项一个 MCP 服务
  servers:
    # 服务名（必填、全局唯一）：只用于日志和跨服务工具重名时的消歧，可自己取
    # - name: "amap"
      # 是否把该服务的工具注入对话；不写默认 true。
      # 改成 false 则只连接不使用，方便临时屏蔽某个服务而不用删配置
      # inject: true
      # 传输方式：http（远端 streamable HTTP / SSE）| stdio（拉起本地命令）
      # transport: "http"
      # url: 服务端点地址
      # url: "https://mcp.amap.com/mcp?key=你的key"
      # token 不写在这里：放 secret.yaml 的 mcp_server_tokens，键是本服务的 name

    # stdio 示例：本地拉起一个 MCP 子进程（生命周期随主程序，退出时自动杀掉）。
    # 这对应别人贴的 mcpServers JSON 写法 → 拆成本配置的 name / transport / command / args 四项：
    # {"mcpServers": {"brave-search": {"command": "cmd", "args": ["/c","npx","-y","mcp-trends-hub@1.6.0"]}}}
    #   ↓
    # Windows 下 npx 是 .cmd 脚本，多数包要经 cmd /c 转发才能被进程直接拉起；uvx要直接写，不能用cmd
    # macOS / Linux 则直接 command: "npx"
    - name: "ddg-search"       # 服务名（必填、全局唯一）：只用于日志和跨服务重名消歧
      # 是否把该服务的工具注入对话；不写默认 true，改成 false 则只连接不使用
      inject: true
      transport: "stdio"
      command: "uvx"
      args: ["duckduckgo-mcp-server"]
      # transport=stdio：可选附加环境变量（叠加到当前进程环境之上），
      # 很多 MCP 包要求的 API key 就放这里
      # env:
      #   SOME_API_KEY: "sk-xxx"