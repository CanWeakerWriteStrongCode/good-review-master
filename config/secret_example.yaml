# ===== 密钥文件 =====
#
# 这个文件只放**密钥**，其余配置仍放 config.yaml。
# 分开的理由：config.yaml 平时会被人复制、贴群里、拿去比对，而这里面每一项泄露都直接有害。
# 它应当权限 0600 且不进版本库（.gitignore 已含 /secret.yaml）。
#
# 优先级：环境变量 > 本文件
#   GOOD_REVIEW_LLM_API_KEY / GOOD_REVIEW_WEB_PASSWORD / GOOD_REVIEW_IM_TOKEN
#
# 所有项都可以留空，留空即按"未配置"处理。

# 大模型 API Key
llm_api_key: ""

# Web 管理面板登录密码
web_password: ""

# JWT 签名密钥。**建议单独设一个随机值**，不要留空：
# 留空会回退成用 web_password 签名，于是改密码会让所有已登录会话立刻掉线，
# 而且两者共用同一份秘密。生成方式：openssl rand -hex 32
jwt_secret: ""

# OneBot 12 接入 token
im_token: ""

# 内嵌 MCP 服务端的 Bearer token
mcp_builtin_token: ""

# 各 MCP 服务的 token，键是 config.yaml 里 mcp.servers[].name
# 例：
#   mcp_server_tokens:
#     amap: "你的高德 key"
mcp_server_tokens: {}
