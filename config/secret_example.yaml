# ===== 密钥文件 =====
#
# 这个文件只放**密钥**，其余配置仍放 config.yaml。
# 分开的理由：config.yaml 平时会被人复制、贴群里、拿去比对，而这里面每一项泄露都直接有害。
# 它应当权限 0600 且不进版本库（.gitignore 已含 /secret.yaml）。
#
# 优先级：环境变量 > 本文件 > config.yaml 的旧位置（兼容用，会打告警提示迁移）
#   GOOD_REVIEW_LLM_API_KEY / GOOD_REVIEW_WEB_PASSWORD / GOOD_REVIEW_NAPCAT_TOKEN
#
# 所有项都可以留空：留空即回退到 config.yaml 的旧位置；两边都没有就按"未配置"处理。

# 大模型 API Key（原 config.yaml 的 llm.api_key）
llm_api_key: ""

# Web 管理面板登录密码（原 config.yaml 的 runtime.web_password）
web_password: ""

# JWT 签名密钥。**建议单独设一个随机值**，不要留空：
# 留空会回退成用 web_password 签名，于是改密码会让所有已登录会话立刻掉线，
# 而且两者共用同一份秘密。生成方式：openssl rand -hex 32
jwt_secret: ""

# NapCat 访问令牌（原 config.yaml 的 napcat.access_token）
napcat_access_token: ""

# 内嵌 MCP 服务端的 Bearer token（原 config.yaml 的 runtime.mcp_builtin_token）
mcp_builtin_token: ""

# 各 MCP 服务的 token，键是 config.yaml 里 mcp.servers[].name（原 mcp.servers[].token）
# 例：
#   mcp_server_tokens:
#     amap: "你的高德 key"
mcp_server_tokens: {}
