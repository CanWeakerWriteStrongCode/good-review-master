# 面板 API 的错误文案（中文）。
#
# 加一条文案的步骤：
#   1. 在 errcode.go 里登记码（常量 + errTable）；
#   2. 在这个文件和 en-US.yaml 里各写一行，key 用 errTable 里的 ID；
#   3. 跑 go test ./web/server —— 漏写哪一份，测试会点名。
#
# 这份文件在二进制外面，改完最长 2 秒生效，不用重启也不用重新编译。
# 带参数的条目用 Go 模板语法 {{.Name}}，参数名和 BizError.Args 的 key 一致。

