# 测试专用配置：GOOD_REVIEW_TEST=1 启动时使用
# 注意：im.api_base 指向死地址，出站调用失败仅 warn；数据由 /api/debug/inject 直接种入。
# global-setup 会先推一条 OB12 事件，让 qq_official_bot_1906xxxx 工作空间开通，
# debug 接口才有对象可操作。
im:
  api_base: "http://127.0.0.1:1"
bot:
  allow_groups: "10001,10002"
  allow_workspace_accounts: ["qq_official_bot_1906xxxx"]
runtime:
  llm_send_count: 3   # 小重置窗口：便于缓存成本用例用少量消息触发重置/扩展
  llm_timeout_sec: 20
  max_msg_rune: 500
  max_cache_msg: 6200
  im_listen_addr: "127.0.0.1:18090"   # 避开 Windows 保留端口段（8059-8158）
  web_port: 9090
  web_username: "admin"
  enable_pprof: true   # 诊断用例要打 /api/debug/pprof/*，必须开
llm:
  provider: "openai"        # 测试模式走 FakeLLM 分支，此值不被读取
  api_base: "http://fake"
  model_name: "fake"
  cache_hit_cost: 0.033
  cache_miss_cost: 1.0
  max_context_tokens: 50000
  temperature: 1.2
  top_p: 0.95
